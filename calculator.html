<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .calculator {
            display: inline-block;
            margin-top: 50px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .calculator input[type="text"] {
            width: 100%;
            height: 50px;
            margin-bottom: 10px;
            font-size: 1.2em;
            text-align: right;
            padding: 5px;
        }
        .calculator button {
            width: 23%;
            height: 50px;
            margin: 1%;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        .calculator button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="result" placeholder="Enter numbers here" disabled>
        <br>
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="setOperation('+')">+</button>
        <br>
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="setOperation('-')">-</button>
        <br>
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="setOperation('*')">*</button>
        <br>
        <button onclick="clearResult()">C</button>
        <button onclick="appendValue('0')">0</button>
        <button onclick="calculateResult()">=</button>
        <button onclick="setOperation('/')">/</button>
        <br>
        <button onclick="deleteLast()">DEL</button>
    </div>

    <script>
        let currentInput = '';
        let operation = '';
        let firstOperand = null;

        function appendValue(value) {
            currentInput += value;
            document.getElementById('result').value = currentInput;
        }

        function setOperation(op) {
            if (currentInput === '') return;
            firstOperand = parseFloat(currentInput);
            operation = op;
            currentInput = '';
            document.getElementById('result').value = '';
        }

        function calculateResult() {
            if (currentInput === '' || firstOperand === null || operation === '') {
                showError('Please complete the operation before calculating.');
                return;
            }
            const secondOperand = parseFloat(currentInput);
            let result;
            switch (operation) {
                case '+':
                    result = firstOperand + secondOperand;
                    break;
                case '-':
                    result = firstOperand - secondOperand;
                    break;
                case '*':
                    result = firstOperand * secondOperand;
                    break;
                case '/':
                    result = secondOperand === 0 ? 'Error: Division by zero' : firstOperand / secondOperand;
                    break;
                default:
                    return;
            }
            document.getElementById('result').value = result;
            currentInput = '';
            operation = '';
            firstOperand = null;
        }

        function clearResult() {
            currentInput = '';
            operation = '';
            firstOperand = null;
            document.getElementById('result').value = '';
        }

        function deleteLast() {
            currentInput = currentInput.slice(0, -1);
            document.getElementById('result').value = currentInput;
        }

        function showError(message) {
            alert(message);
        }
    </script>
</body>
</html>
